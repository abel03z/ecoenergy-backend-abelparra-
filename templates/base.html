<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EcoEnergy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'dispositivos:inicio' %}">EcoEnergy</a>
        <div>
            <a class="nav-link d-inline text-white me-3" href="{% url 'dispositivos:inicio' %}">Inicio</a>
            <a class="nav-link d-inline text-white me-3" href="{% url 'dispositivos:zonas' %}">Zonas</a>
            <a class="nav-link d-inline text-white" href="{% url 'dispositivos:resumen_zonas' %}">Resumen</a>
        </div>
    </nav>
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
