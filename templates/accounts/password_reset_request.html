{% extends "base.html" %}
{% block title %}Recuperar contraseña · EcoEnergy{% endblock %}
{% block content %}
<h1>¿Olvidaste tu contraseña?</h1>
<p>Ingresa tu correo y te enviaremos un código de recuperación.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Enviar código</button>
</form>
{% endblock %}
