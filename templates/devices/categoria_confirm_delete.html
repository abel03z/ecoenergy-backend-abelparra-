{% extends "base.html" %}
{% block title %}Eliminar categoría{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Eliminar categoría</h4>
      </div>
      <div class="card-body">
        <div class="alert alert-warning">
          <strong>¿Está seguro de eliminar esta categoría?</strong>
          <p class="mb-0 mt-2">Esta acción no se puede deshacer.</p>
        </div>
        <p><strong>Categoría:</strong> {{ object.nombre }}</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-between">
            <a href="{% url 'devices:categoria_list' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
